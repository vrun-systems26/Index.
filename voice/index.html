<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Index · Voice</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#4A3A32;
       background:linear-gradient(105deg,#FDE9D6,#F9BFA5);min-height:100vh}
  .wrap{max-width:1150px;margin:0 auto;padding:28px 20px}
  header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:20px}
  .brand{font-size:28px;font-weight:700}.brand span{color:#2A5F5A}
  .pills{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .pill{border-radius:100px;padding:7px 14px;font:600 13px ui-monospace,monospace;background:#FFFBF8;color:#9C8576}
  .pill.ok{background:#DCEDEA;color:#2A5F5A}.pill.busy{background:#F7E2D6;color:#C0704E}.pill.err{background:#F6D5D5;color:#A33}
  .cols{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
  @media(max-width:850px){.cols{grid-template-columns:1fr}}
  .card{background:#FFFBF8cc;border-radius:18px;padding:18px}
  h2{margin:0 0 12px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#9C8576}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .cell{background:#FFFBF8;border:2px solid transparent;border-radius:12px;padding:12px;min-height:82px;cursor:pointer;
        display:flex;flex-direction:column;justify-content:space-between;transition:.2s}
  .cell:hover{border-color:#F3C9B3}
  .cell .n{font:11px ui-monospace,monospace;color:#9C8576}
  .cell .i{font-weight:600;font-size:14px;margin-top:8px}
  .cell.empty .i{color:#C9B6AA;font-style:italic;font-weight:400}
  .cell.active{border-color:#C0704E;background:#F7E2D6;transform:scale(1.04)}
  .cell.out{border-color:#2A5F5A;background:#DCEDEA}
  .hint{font-size:12px;color:#9C8576;margin-top:10px}
  .tray{margin-top:16px;padding:14px 16px;border-radius:14px;background:#FFFBF8;display:flex;
        justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .tray.on{background:#2A5F5A;color:#fff}
  .tray.ask{background:#F7E2D6;border:2px solid #C0704E}.tray[hidden]{display:none}
  .tray .small{font:12px ui-monospace,monospace;opacity:.75}
  .tray .big{font-size:17px;font-weight:700}
  .tray button{background:#2A5F5A;color:#fff}.tray.on button{background:#fff;color:#2A5F5A}
  .last{margin-top:16px;padding:16px;border-radius:14px;background:#FFFBF8;border-left:5px solid #C9B6AA}
  .last.ok{border-left-color:#2A5F5A}.last.err{border-left-color:#C0504E}
  .last .big{font-size:20px;font-weight:700;margin:4px 0}
  .last .small{font:12px ui-monospace,monospace;color:#9C8576}
  button{font:600 15px system-ui;border:0;border-radius:12px;padding:12px 18px;cursor:pointer}
  .talk{width:100%;padding:18px;font-size:17px;background:#2A5F5A;color:#fff}
  .talk.on{background:#C0504E}
  .usb{background:#FFFBF8;color:#2A5F5A}
  input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #F3C9B3;background:#FFFBF8;font:13px ui-monospace,monospace;margin-bottom:10px}
  .mode{text-align:center;margin:12px 0;font-weight:600;color:#2A5F5A;min-height:20px}
  .log{height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;font-size:14px}
  .msg{padding:9px 12px;border-radius:12px;max-width:90%}
  .msg.user{align-self:flex-end;background:#2A5F5A;color:#fff}
  .msg.agent{align-self:flex-start;background:#FFFBF8}
  .msg.sys{align-self:center;background:transparent;color:#9C8576;font:12px ui-monospace,monospace}
  .msg.esp{align-self:center;background:#DCEDEA;color:#2A5F5A;font:12px ui-monospace,monospace}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Index<span>.</span> voice</div>
    <div class="pills">
      <div class="pill" id="pAgent">agent: off</div>
      <div class="pill" id="pRobot">robot: simulated</div>
      <button class="usb" id="btnUsb">Connect robot (USB)</button>
    </div>
  </header>

  <div class="cols">
    <div class="card">
      <h2>Cabinet</h2>
      <div class="grid" id="grid"></div>
      <div class="hint">Click a compartment to test a retrieval without the agent (no credits used).</div>
      <div class="tray" id="tray">
        <div><div class="small" id="traySmall">DELIVERY SPOT</div><div class="big" id="trayTxt">No tray out</div></div>
        <button id="btnReturn">Return tray</button>
      </div>
      <div class="tray ask" id="ask" hidden>
        <div><div class="small">WAITING FOR YOUR OK</div><div class="big" id="askTxt"></div></div>
        <div><button id="askYes">Yes, bring it</button> <button id="askNo">No</button></div>
      </div>
      <div class="last" id="last">
        <div class="small">LAST COMMAND</div>
        <div class="big" id="lastBig">None yet</div>
        <div class="small" id="lastSmall">The agent's tool calls show up here.</div>
      </div>
    </div>

    <div class="card">
      <h2>Voice agent</h2>
      <input id="agentId" placeholder="Paste your ElevenLabs agent ID here">
      <button class="talk" id="btnTalk">Start conversation</button>
      <div class="mode" id="mode"></div>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>

<script type="module">
import { Conversation } from "https://cdn.jsdelivr.net/npm/@elevenlabs/client/+esm";
import { ConfirmGate, guardTools } from "./confirm.js";

// ---------- inventory (empty string = empty compartment) ----------
const INVENTORY = [
  "Bandages", "Ear drops", "Ibuprofen", "Allergy tablets", "Thermometer",
  "Cough syrup", "Tweezers", "Gauze", "Antiseptic wipes", "Eye drops",
  "Screwdriver", "AA batteries", "Duct tape", "Scissors", ""
];
const SIM_MS = 4000;                       // how long a simulated trip takes

const $ = id => document.getElementById(id);
const grid = $("grid"), log = $("log");
const nameOf = c => INVENTORY[c - 1] || "?";
const now = () => new Date().toLocaleTimeString();

// ---------- robot state (best guess, kept in sync from the ESP32's serial messages) ----------
// The ROBOT is always the real authority: every button/tool asks it, and the page follows its replies.
const S = { trayOut: 0, moving: 0, stopped: "" };     // moving: compartment number, or -1 for a return
let waiters = [];

function setState(patch) {
  Object.assign(S, patch);
  render();
  waiters = waiters.filter(w => {
    if (w.cond())  { w.res(true);  return false; }
    if (S.stopped) { w.res(false); return false; }
    return true;
  });
}
function waitUntil(cond, ms) {
  return new Promise(res => {
    if (cond()) return res(true);
    const w = { cond, res };
    waiters.push(w);
    setTimeout(() => { if (waiters.includes(w)) { waiters = waiters.filter(x => x !== w); res(false); } }, ms);
  });
}

function renderGrid() {
  grid.innerHTML = "";
  INVENTORY.forEach((name, i) => {
    const c = i + 1, d = document.createElement("div");
    d.id = "cell" + c;
    d.innerHTML = `<div class="n">${String(c).padStart(2, "0")} · R${Math.floor(i / 5) + 1} C${i % 5 + 1}</div>
                   <div class="i">${name || "empty"}</div>`;
    d.onclick = () => retrieve(c, "click");
    grid.appendChild(d);
  });
}
function render() {
  INVENTORY.forEach((name, i) => {
    const c = i + 1;
    $("cell" + c).className = "cell" + (name ? "" : " empty") +
      (S.moving === c ? " active" : "") + (S.trayOut === c ? " out" : "");
  });
  $("tray").className = "tray" + (S.trayOut ? " on" : "");
  $("traySmall").textContent = S.trayOut ? "AT THE DELIVERY SPOT" : "DELIVERY SPOT";
  $("trayTxt").textContent = S.moving === -1 ? "Putting the tray back…" :
                             S.trayOut ? `Compartment ${S.trayOut} · ${nameOf(S.trayOut)}` : "No tray out";
  const base = writer ? "robot: " : "robot (simulated): ";
  if (S.moving === -1)  setPill($("pRobot"), base + "returning", "busy");
  else if (S.moving)    setPill($("pRobot"), base + "retrieving " + S.moving, "busy");
  else if (S.trayOut)   setPill($("pRobot"), base + "tray " + S.trayOut + " out", "ok");
  else                  setPill($("pRobot"), writer ? "robot: connected" : "robot: simulated", writer ? "ok" : "");
}

function addLog(kind, text) {
  const d = document.createElement("div");
  d.className = "msg " + kind;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}
function setPill(el, text, cls) { el.textContent = text; el.className = "pill " + (cls || ""); }
function showLast(ok, big, small) {
  $("last").className = "last " + (ok ? "ok" : "err");
  $("lastBig").textContent = big;
  $("lastSmall").textContent = small;
}

// ---------- USB serial to the ESP32 (optional) ----------
let port = null, writer = null, replyWaiter = null;

$("btnUsb").onclick = async () => {
  if (!("serial" in navigator)) { alert("Web Serial needs Chrome or Edge on desktop."); return; }
  if (writer) { addLog("sys", "already connected"); return; }
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    writer = port.writable.getWriter();
    setState({ trayOut: 0, moving: 0, stopped: "" });      // the ESP32 reboots on connect, so it starts fresh
    addLog("sys", "USB connected (the ESP32 reboots once when the port opens - only connect with no tray out)");
    readLoop();
  } catch (e) { addLog("sys", "USB: " + e.message); }
};

function handleLine(line) {
  addLog("esp", "ESP32: " + line);
  let m;
  if (/^(ACK|OK|ERR)/.test(line) && replyWaiter) { const w = replyWaiter; replyWaiter = null; w(line); return; }
  if ((m = line.match(/^>>> Retrieving (\d+)/)))                setState({ moving: parseInt(m[1]), stopped: "" });
  else if ((m = line.match(/^>>> Compartment (\d+) .*ready/)))  setState({ trayOut: parseInt(m[1]), moving: 0 });
  else if ((m = line.match(/^>>> Compartment (\d+) returned/))) setState({ trayOut: 0, moving: 0 });
  else if ((m = line.match(/^>>> STOPPED: (.*)/))) {
    setState({ moving: 0, stopped: m[1] });
    showLast(false, "Robot stopped", m[1] + " - use the phone page (192.168.4.1) to Return or Home.");
  }
  else if (/^>>> /.test(line) && S.moving) setState({ moving: 0 });   // any other finish message
}

async function readLoop() {
  const dec = new TextDecoderStream();
  port.readable.pipeTo(dec.writable);
  const reader = dec.readable.getReader();
  let buf = "";
  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (line) handleLine(line);
      }
    }
  } catch (e) {}
  writer = null;
  setPill($("pRobot"), "robot: disconnected", "err");
  addLog("sys", "USB disconnected - press Connect robot (USB) again (only with no tray out)");
}

function sendCmd(text, ms = 2000) {          // resolves with the robot's ACK/OK/ERR line, or null
  return new Promise(async res => {
    replyWaiter = res;
    setTimeout(() => { if (replyWaiter === res) { replyWaiter = null; res(null); } }, ms);
    try { await writer.write(new TextEncoder().encode(text + "\n")); }
    catch (e) { if (replyWaiter === res) { replyWaiter = null; res(null); } }
  });
}

// ---------- the two robot actions (real or simulated) ----------
// doGo returns {ok, how} or {ok:false, msg, outComp} (outComp = the tray the robot says is still out)
async function doGo(c) {
  if (!writer) {
    if (S.moving)  return { ok: false, msg: "the robot is moving right now - try again when it stops" };
    if (S.trayOut) return { ok: false, msg: `compartment ${S.trayOut} is still out`, outComp: S.trayOut };
    setState({ moving: c, stopped: "" });
    setTimeout(() => setState({ trayOut: c, moving: 0 }), SIM_MS);
    return { ok: true, how: "simulated (no robot connected)" };
  }
  const r = await sendCmd(`GO ${c}`);
  if (r === `ACK ${c}`)     { setState({ moving: c, stopped: "" }); return { ok: true, how: `robot confirmed ACK ${c} ✓` }; }
  if (!r)                   return { ok: false, msg: "robot did not respond within 2 s - is the USB still connected?" };
  if (r.startsWith("ACK"))  return { ok: false, msg: `robot acknowledged ${r.slice(4)}, expected ${c}` };
  const m = r.match(/compartment (\d+) is still out/);
  if (m) { setState({ trayOut: parseInt(m[1]) }); return { ok: false, msg: r.replace(/^ERR /, ""), outComp: parseInt(m[1]) }; }
  if (/busy/.test(r))       return { ok: false, msg: "the robot is moving right now - try again when it stops" };
  return { ok: false, msg: "robot said: " + r.replace(/^ERR /, "") };
}

async function doReturn() {
  if (!writer) {
    if (!S.trayOut) return { ok: false, msg: "no tray is out" };
    setState({ moving: -1, stopped: "" });
    setTimeout(() => setState({ trayOut: 0, moving: 0 }), SIM_MS);
    return { ok: true };
  }
  const r = await sendCmd("RET");                     // always ask the robot - it knows which tray is out
  if (r && r.startsWith("OK")) { setState({ moving: -1, stopped: "" }); return { ok: true }; }
  if (!r)                      return { ok: false, msg: "robot did not respond within 2 s - is the USB still connected?" };
  if (/no tray is out/.test(r)) { setState({ trayOut: 0 }); return { ok: false, msg: "the robot says no tray is out" }; }
  if (/busy/.test(r))          return { ok: false, msg: "the robot is moving right now - try again when it stops" };
  return { ok: false, msg: "robot said: " + r.replace(/^ERR /, "") };
}

// ---------- what the agent, the clicks and the Return button call ----------
function fail(msg) {
  showLast(false, "Rejected", msg);
  addLog("sys", "✗ " + msg);
  return "ERROR: " + msg;
}

async function retrieve(c, source) {
  c = parseInt(c);
  if (!(c >= 1 && c <= 15)) return fail(`compartment ${c} doesn't exist (1-15 only)`);
  if (!INVENTORY[c - 1])    return fail(`compartment ${c} is empty`);
  if (S.trayOut === c && !S.moving) return `Compartment ${c} (${nameOf(c)}) is already at the delivery spot.`;

  const g = await doGo(c);
  if (g.ok) {
    showLast(true, `GO ${c} · ${nameOf(c)}`, `${now()} · from ${source} · ${g.how}`);
    addLog("sys", `✓ GO ${c} (${nameOf(c)}): ${g.how}`);
    return `OK: retrieving compartment ${c} (${nameOf(c)}). ${g.how}.`;
  }
  if (!g.outComp) return fail(g.msg);
  if (g.outComp === c) return `Compartment ${c} (${nameOf(c)}) is already at the delivery spot.`;

  // another tray is out: put it back first, then fetch this one
  const prev = g.outComp;
  const r = await doReturn();
  if (!r.ok) return fail(r.msg);
  showLast(true, `Return ${prev}, then GO ${c}`, `${now()} · from ${source}`);
  addLog("sys", `↩ putting compartment ${prev} back first, then getting ${c}`);
  waitUntil(() => !S.trayOut && !S.moving, 120000).then(async back => {
    if (!back) { fail(`compartment ${prev} didn't finish going back, so ${c} wasn't fetched`); return; }
    const g2 = await doGo(c);
    if (!g2.ok) { fail(g2.msg); return; }
    showLast(true, `GO ${c} · ${nameOf(c)}`, `${now()} · from ${source} · ${g2.how}`);
    addLog("sys", `✓ GO ${c} (${nameOf(c)}): ${g2.how}`);
  });
  return `OK: putting compartment ${prev} (${nameOf(prev)}) back first, then bringing out compartment ${c} (${nameOf(c)}). This takes about a minute.`;
}

async function returnTray(source) {
  const prev = S.trayOut;
  const r = await doReturn();
  if (!r.ok) return fail(r.msg);
  const what = prev ? `compartment ${prev} (${nameOf(prev)})` : "the tray";
  showLast(true, prev ? `Return ${prev} · ${nameOf(prev)}` : "Return tray", `${now()} · from ${source}`);
  addLog("sys", `↩ returning ${what}`);
  return `OK: putting ${what} back.`;
}

$("btnReturn").onclick = () => returnTray("button");
renderGrid();
render();

// ---------- confirmation gate: the agent cannot move the robot unless the person said so ----------
const gate = new ConfirmGate(INVENTORY);
let asking = null;
function showAsk(kind, c) {
  asking = { kind, c };
  $("askTxt").textContent = kind === "retrieve" ? `Bring compartment ${c} · ${nameOf(c)}?` : "Put the tray back?";
  $("askYes").textContent = kind === "retrieve" ? "Yes, bring it" : "Yes, put it back";
  $("ask").hidden = false;
  addLog("sys", "✗ blocked: the agent tried to move without your OK");
}
function hideAsk() { asking = null; $("ask").hidden = true; }
$("askYes").onclick = () => {
  const a = asking;
  gate.reset();
  hideAsk();
  if (a) a.kind === "retrieve" ? retrieve(a.c, "your tap") : returnTray("your tap");
};
$("askNo").onclick = () => { gate.reset(); hideAsk(); addLog("sys", "you said no"); };
const agentTools = guardTools({
  gate, inventory: INVENTORY, onBlocked: showAsk,
  retrieve: (c, s) => { hideAsk(); return retrieve(c, s); },
  returnTray: s => { hideAsk(); return returnTray(s); },
});
function heard(source, message) {
  addLog(source === "user" ? "user" : "agent", message);
  if (source === "user") addLog("sys", gate.userSaid(message));
  else gate.agentSaid(message);
}

// ---------- voice agent ----------
let convo = null;
try { $("agentId").value = localStorage.getItem("agentId") || ""; } catch (e) {}

$("btnTalk").onclick = async () => {
  if (convo) { await convo.endSession(); return; }

  const agentId = $("agentId").value.trim();
  if (!agentId) { alert("Paste your agent ID first."); return; }
  try { localStorage.setItem("agentId", agentId); } catch (e) {}

  try {
    await navigator.mediaDevices.getUserMedia({ audio: true });
    setPill($("pAgent"), "agent: connecting…", "busy");

    gate.reset();
    hideAsk();
    convo = await Conversation.startSession({
      agentId,
      clientTools: {
        get_inventory: async () => {
          addLog("sys", "agent read the inventory");
          return JSON.stringify({
            tray_at_delivery_spot: S.trayOut ? { compartment: S.trayOut, item: nameOf(S.trayOut) } : "none",
            compartments: INVENTORY.map((name, i) => ({
              compartment: i + 1, row: Math.floor(i / 5) + 1, column: i % 5 + 1, item: name || "EMPTY"
            }))
          });
        },
        ...agentTools,
      },
      onConnect: () => {
        setPill($("pAgent"), "agent: live", "ok");
        $("btnTalk").textContent = "End conversation";
        $("btnTalk").classList.add("on");
      },
      onDisconnect: () => {
        convo = null;
        gate.reset();
        hideAsk();
        setPill($("pAgent"), "agent: off");
        $("btnTalk").textContent = "Start conversation";
        $("btnTalk").classList.remove("on");
        $("mode").textContent = "";
        addLog("sys", "conversation ended");
      },
      onMessage: ({ source, message }) => heard(source, message),
      onModeChange: ({ mode }) => { $("mode").textContent = mode === "speaking" ? "🔊 speaking" : "🎙 listening"; },
      onError: e => { addLog("sys", "error: " + (e?.message || e)); setPill($("pAgent"), "agent: error", "err"); },
    });
  } catch (e) {
    addLog("sys", "could not start: " + e.message);
    if (/fetch/i.test(e.message)) addLog("sys", "→ this laptop can't reach ElevenLabs. Is it on the \"Index\" WiFi? That network has no internet - switch the laptop back to your home WiFi (the phone stays on Index).");
    setPill($("pAgent"), "agent: error", "err");
    convo = null;
  }
};
</script>
</body>
</html>
